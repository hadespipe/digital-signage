<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Digital Signage</title><link rel="stylesheet" href="style.css"></head><body>
<main><img id="display" alt="Display image" hidden><p id="status">Connecting…</p></main>
<section id="settings" role="dialog" aria-modal="true" aria-labelledby="title" hidden><form id="form" novalidate><h1 id="title">Digital Signage settings</h1><label>Server URL<input id="server" type="url" autocomplete="off"></label><label>TV token<input id="token" type="password" autocomplete="off"></label><label class="check"><input id="lan" type="checkbox">Allow HTTP for LAN testing only</label><p id="error" role="alert"></p><button type="submit">Save and play</button><p>Hold OK for 1.5 seconds during playback to open settings. Back returns to playback.</p></form></section>
<script src="player.js"></script><script src="transport.js"></script><script src="settings.js"></script><script src="main.js"></script></body></html>
