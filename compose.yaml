services:
  signage:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - path: .env.docker
        format: raw
    environment:
      DATA_DIR: /data
      PORT: "3000"
    volumes:
      - signage-data:/data
    mem_limit: 2g
    cpus: 2
    stop_grace_period: 30s
    restart: unless-stopped
volumes:
  signage-data:
